<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">MATH.OS logo mark</title>
  <desc id="desc">A premium dark mathematics orbit mark with connected nodes and an integral curve.</desc>
  <defs>
